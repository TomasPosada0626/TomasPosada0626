name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake grids
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TomasPosada0626
          # NOTE: color values need a literal #, URL-encoded as %23 -- without
          # it Platane/snk writes e.g. `--ce:2d3343` (no #) into the SVG's
          # CSS, which is not a valid color, so `fill:var(--ce)` silently
          # fails to invalid-at-computed-value and every cell renders as
          # the SVG fill default (black) instead of the intended slate.
          # Confirmed by rendering both ways and diffing actual pixel color.
          outputs: |
            dist/snake-dark.svg?color_snake=%2310b981&color_dots=%232d3343,%230891b2,%2322d3ee,%23a78bfa,%237c3aed
            dist/snake-light.svg?color_snake=%237c3aed&color_dots=%23ebedf0,%230891b2,%2322d3ee,%2310b981,%237c3aed

      - name: placeholder so Vercel's Root Directory check doesn't fail here
        # Vercel's GitHub App watches every branch of this repo, including
        # `output` (it has no way to know only `main` matters) -- so every
        # force-push here also fires an automatic Preview build attempt for
        # the project-cards Vercel project. That project's Root Directory
        # is services/project-cards, which doesn't exist on this branch,
        # and Vercel resolves Root Directory *before* it ever gets to
        # evaluate Ignored Build Step, so that setting can't skip it either
        # -- the build fails at checkout and Vercel emails a deploy-failed
        # notice every ~12h. A trivial file at that same path is enough to
        # let Root Directory resolve; Ignored Build Step then runs as
        # normal and skips the build for any branch that isn't main.
        run: mkdir -p dist/services/project-cards && echo "placeholder so Vercel's Root Directory check doesn't fail on this branch" > dist/services/project-cards/.keep

      - name: push grids to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
