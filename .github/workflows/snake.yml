name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake grids
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TomasPosada0626
          outputs: |
            dist/snake-dark.svg?color_snake=10b981&color_dots=2d3343,0891b2,22d3ee,a78bfa,7c3aed
            dist/snake-light.svg?color_snake=7c3aed&color_dots=ebedf0,0891b2,22d3ee,10b981,7c3aed

      - name: push grids to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
